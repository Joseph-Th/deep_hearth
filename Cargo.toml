[package]
name = "deep_hearth"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[package.metadata.git-wizard.validation]
quick = "python ci.py gate"
full = "python ci.py audit"

[[bin]]
name = "validate-shaders"
path = "src/bin/validate_shaders.rs"
required-features = ["test-shader-validation"]

[[test]]
name = "gameplay_harness"
path = "tests/gameplay_harness/full_target.rs"
required-features = ["test-gameplay-full"]

[[test]]
name = "gameplay_workshop"
path = "tests/gameplay_harness/main.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_survival"
path = "tests/gameplay_survival.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_progression"
path = "tests/gameplay_progression.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_ore"
path = "tests/gameplay_ore.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_foundry"
path = "tests/gameplay_foundry.rs"
required-features = ["test-gameplay"]

[features]
default = []
test-gameplay = []
test-gameplay-full = ["test-gameplay"]
test-shader-validation = ["dep:naga"]
test-soak = []
# Unit-test shard features are compile-selection controls only. Ordinary `cargo test` enables none of
# them and therefore retains the complete unit-test inventory. A focused shard enables its group plus
# the umbrella so unrelated `#[cfg(test)]` modules are not parsed/type-checked/code-generated.
test-unit-sharded = []
test-unit-foundation = ["test-unit-sharded"]
test-unit-resources = ["test-unit-sharded"]
test-unit-player = ["test-unit-sharded"]
test-unit-industry = ["test-unit-sharded"]
test-unit-render = ["test-unit-sharded"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
naga = { version = "30.0.0", features = ["wgsl-in"], optional = true }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[profile.test]
# Test failures already carry source locations and typed assertion context; omitting debug symbols
# keeps local test-binary codegen/linking out of the ordinary feedback bottleneck.
debug = 0

[profile.validation]
# One-shot validation binaries need fast codegen/linking, not debugger symbols. Keep ordinary dev
# builds unchanged so interactive debugging remains available without profile overrides.
inherits = "dev"
debug = 0

[profile.release]
overflow-checks = true
