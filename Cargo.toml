[package]
name = "deep_hearth"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[profile.release]
overflow-checks = true
