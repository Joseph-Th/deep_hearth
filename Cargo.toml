[package]
name = "deep_hearth"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[package.metadata.git-wizard.validation]
quick = "python ci.py quick"
standard = "python ci.py gate"

[[bin]]
name = "validate-shaders"
path = "src/bin/validate_shaders.rs"
required-features = ["test-shader-validation"]

[[example]]
name = "gameplay-report"
path = "tests/gameplay_report.rs"
required-features = ["test-gameplay"]
test = false

[[example]]
name = "gameplay-workshop-report"
path = "tests/gameplay_workshop_report.rs"
required-features = ["test-gameplay"]
test = false

[[test]]
name = "gameplay_contracts"
path = "tests/gameplay_contracts.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_audit"
path = "tests/gameplay_audit.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_workshop"
path = "tests/gameplay_workshop.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_survival"
path = "tests/gameplay_survival.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_progression"
path = "tests/gameplay_progression.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_progression_contracts"
path = "tests/gameplay_progression_contracts.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_liberation"
path = "tests/gameplay_liberation.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_settlement"
path = "tests/gameplay_settlement.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_settlement_contracts"
path = "tests/gameplay_settlement_contracts.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_foundry_bootstrap"
path = "tests/gameplay_foundry_bootstrap.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_woodworking"
path = "tests/gameplay_woodworking.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_woodworking_contracts"
path = "tests/gameplay_woodworking_contracts.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_fieldwork"
path = "tests/gameplay_fieldwork.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_fieldwork_contracts"
path = "tests/gameplay_fieldwork_contracts.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_power"
path = "tests/gameplay_power.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_ore"
path = "tests/gameplay_ore.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_ore_contracts"
path = "tests/gameplay_ore_contracts.rs"
required-features = ["test-gameplay"]

[[test]]
name = "gameplay_foundry"
path = "tests/gameplay_foundry.rs"
required-features = ["test-gameplay"]

[features]
default = []
test-gameplay = []
test-shader-validation = ["dep:naga"]
test-soak = []
test-unit-shard = []
test-unit-capability = ["test-unit-shard"]
test-unit-content = ["test-unit-shard"]
test-unit-core = ["test-unit-shard"]
test-unit-crafting = ["test-unit-shard"]
test-unit-energy = ["test-unit-shard"]
test-unit-equipment = ["test-unit-shard"]
test-unit-fluid = ["test-unit-shard"]
test-unit-geology = ["test-unit-shard"]
test-unit-inventory = ["test-unit-shard"]
test-unit-labor = ["test-unit-shard"]
test-unit-logistics = ["test-unit-shard"]
test-unit-maintenance = ["test-unit-shard"]
test-unit-material = ["test-unit-shard"]
test-unit-matter = ["test-unit-shard"]
test-unit-mining = ["test-unit-shard"]
test-unit-ore-processing = ["test-unit-shard"]
test-unit-persistence = ["test-unit-shard"]
test-unit-production = ["test-unit-shard"]
test-unit-registry = ["test-unit-shard"]
test-unit-shader = ["test-unit-shard"]
test-unit-simulation = ["test-unit-shard"]
test-unit-spatial = ["test-unit-shard"]
test-unit-structural = ["test-unit-shard"]
test-unit-survival = ["test-unit-shard"]
test-unit-texture = ["test-unit-shard"]
test-unit-thermal = ["test-unit-shard"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
naga = { version = "30.0.0", features = ["wgsl-in"], optional = true }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[profile.test]
# Test failures already carry source locations and typed assertion context; omitting debug symbols
# keeps local test-binary codegen/linking out of the ordinary feedback bottleneck. A moderate CGU
# count is faster for this Windows-local workload than maximal fragmentation because it sharply cuts
# lld-link input/object overhead while preserving useful incremental codegen parallelism.
debug = 0
codegen-units = 32
incremental = true

[profile.release]
overflow-checks = true
