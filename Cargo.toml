[package]
name = "deep_hearth"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[[bin]]
name = "validate-shaders"
path = "src/bin/validate_shaders.rs"
required-features = ["test-shader-validation"]

[[test]]
name = "gameplay_harness"
path = "tests/gameplay_harness/main.rs"
required-features = ["test-gameplay"]

[features]
default = []
test-gameplay = []
test-shader-validation = ["dep:naga"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
naga = { version = "30.0.0", features = ["wgsl-in"], optional = true }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[profile.test]
# Test failures already carry source locations and typed assertion context; omitting debug symbols
# keeps local test-binary codegen/linking out of the ordinary feedback bottleneck.
debug = 0

[profile.validation]
# One-shot validation binaries need fast codegen/linking, not debugger symbols. Keep ordinary dev
# builds unchanged so interactive debugging remains available without profile overrides.
inherits = "dev"
debug = 0

[profile.release]
overflow-checks = true
