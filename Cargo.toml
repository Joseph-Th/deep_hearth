[features]
default = []
test-gameplay = []
test-shader-validation = ["dep:naga"]
test-soak = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
naga = { version = "30.0.0", features = ["wgsl-in"], optional = true }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[profile.test]
# Local iteration is dominated by incremental rebuilds after small source edits. On the current
# toolchain, 512 codegen units materially outperforms 256 for focused gameplay rebuilds. Core,
# gameplay, checks, and diagnostics intentionally share this one local codegen profile so switching
# proof types reuses already-compiled production dependencies.
debug = 0
codegen-units = 512
incremental = true

[profile.release]
overflow-checks = true
