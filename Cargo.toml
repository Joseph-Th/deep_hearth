[package]
name = "deep_hearth"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[package.metadata.git-wizard.validation]
quick = "python ci.py quick"
# Generic completion cannot know which owner or gameplay contract changed. Keep it build-free so a
# correctly targeted Rust proof is not followed by a redundant second Cargo build.
standard = "python ci.py quick"
full = "python ci.py audit --all"

[[bin]]
name = "validate-shaders"
path = "src/bin/validate_shaders.rs"
required-features = ["test-shader-validation"]

[[example]]
name = "gameplay-report"
path = "tests/gameplay_report.rs"
required-features = ["test-gameplay"]
test = false

