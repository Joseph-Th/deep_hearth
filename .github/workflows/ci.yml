name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "1"
  CARGO_TERM_COLOR: always

jobs:
  scope:
    name: CI scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      format: ${{ steps.plan.outputs.format }}
      lint: ${{ steps.plan.outputs.lint }}
      core: ${{ steps.plan.outputs.core }}
      gameplay: ${{ steps.plan.outputs.gameplay }}
      shaders: ${{ steps.plan.outputs.shaders }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Validate scope classifier
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Resolve build plan
        id: plan
        shell: bash
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            printf '%s\n' \
              'format=true' \
              'lint=true' \
              'core=true' \
              'gameplay=true' \
              'shaders=true' | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only HEAD^ | python3 -B .github/scripts/ci_scope.py plan | tee -a "$GITHUB_OUTPUT"
          fi

  quality:
    name: Format and lint
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.outputs.format == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust formatting toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Install Clippy
        if: ${{ github.event_name != 'pull_request' || needs.scope.outputs.lint == 'true' }}
        run: rustup component add clippy
      - name: Cache Cargo dependencies
        if: ${{ github.event_name != 'pull_request' || needs.scope.outputs.lint == 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-deps-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-rust-1.97.0-
      - name: Cache quality build
        if: ${{ github.event_name != 'pull_request' || needs.scope.outputs.lint == 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            target
          key: ${{ runner.os }}-rust-1.97.0-quality-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-${{ hashFiles('src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.0-quality-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
      - name: Format
        run: cargo fmt --check
      - name: Lint
        if: ${{ github.event_name != 'pull_request' || needs.scope.outputs.lint == 'true' }}
        run: cargo test-lint

  core:
    name: Core and soak tests
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.outputs.core == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-deps-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-rust-1.97.0-
      - name: Cache core build
        uses: actions/cache@v5
        with:
          path: |
            target
          key: ${{ runner.os }}-rust-1.97.0-test-target-core-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-${{ hashFiles('src/**/*.rs', 'assets/**/*.wgsl') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.0-test-target-core-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
            ${{ runner.os }}-rust-1.97.0-test-target-gameplay-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
            ${{ runner.os }}-rust-1.97.0-test-target-
      - name: Core + soak tests
        run: cargo test-ci-core

  gameplay:
    name: Gameplay harness
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.outputs.gameplay == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-deps-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-rust-1.97.0-
      - name: Cache gameplay build
        uses: actions/cache@v5
        with:
          path: |
            target
          key: ${{ runner.os }}-rust-1.97.0-test-target-gameplay-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-${{ hashFiles('src/**/*.rs', 'tests/gameplay_harness/**/*.rs', 'assets/**/*.wgsl') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.0-test-target-gameplay-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
            ${{ runner.os }}-rust-1.97.0-test-target-core-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
            ${{ runner.os }}-rust-1.97.0-test-target-
      - name: Gameplay tests
        run: cargo test-gameplay

  shaders:
    name: WGSL validation
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.outputs.shaders == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-deps-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-rust-1.97.0-
      - name: Cache shader build
        uses: actions/cache@v5
        with:
          path: |
            target
          key: ${{ runner.os }}-rust-1.97.0-shaders-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-${{ hashFiles('src/**/*.rs', 'assets/**/*.wgsl') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.0-shaders-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
      - name: Shader validation
        run: cargo test-shaders
