name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "1"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.97.0-quality-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-${{ hashFiles('src/**/*.rs', 'assets/**/*.wgsl') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.0-quality-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo test-lint

  core:
    name: Core and soak tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.97.0-core-soak-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-${{ hashFiles('src/**/*.rs', 'assets/**/*.wgsl') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.0-core-soak-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
      - name: Core and soak tests
        run: cargo test-ci-core

  gameplay:
    name: Gameplay harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.97.0-gameplay-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-${{ hashFiles('src/**/*.rs', 'assets/**/*.wgsl') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.0-gameplay-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
      - name: Gameplay tests
        run: cargo test-gameplay

  shaders:
    name: WGSL validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.97.0-shaders-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-${{ hashFiles('src/**/*.rs', 'assets/**/*.wgsl') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.0-shaders-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}-
      - name: Shader validation
        run: cargo test-shaders
