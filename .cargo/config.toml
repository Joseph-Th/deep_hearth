[alias]
# Daily feedback stays on the default feature set so expensive harness/parser-only dependencies do
# not enter ordinary edit-loop builds. Specialized lanes opt into those features explicitly.
check-fast = "check --quiet --locked --lib"
test-check = "check --locked --all-targets"
# The ordinary lint gate checks production code only. `test-fast` compiles and executes the complete
# default-feature unit-test target immediately afterward, while `test-lint-all` remains the explicit
# all-target/all-feature Clippy audit for cross-cutting and release hardening.
test-lint = "clippy --locked --lib -- -D warnings"
test-lint-all = "clippy --locked --all-targets --all-features -- -D warnings"
test-fast = "test --quiet --locked --lib"
test-soak = "test --quiet --locked --lib -- --ignored"
test-all = "test --quiet --locked --lib -- --include-ignored"
test-gameplay = "test --quiet --locked --test gameplay_harness --features test-gameplay"
test-gameplay-scenarios = "test --quiet --locked --test gameplay_harness --features test-gameplay gameplay_harness_gate -- --exact"
test-gameplay-progression = "test --quiet --locked --test gameplay_harness --features test-gameplay gameplay_primitive_progression_probe -- --exact"
test-gameplay-ore = "test --quiet --locked --test gameplay_harness --features test-gameplay gameplay_ore_preparation_probe -- --exact"
test-gameplay-foundry = "test --quiet --locked --test gameplay_harness --features test-gameplay gameplay_foundry_probe -- --exact"
test-gameplay-report = "test --quiet --locked --test gameplay_harness --features test-gameplay gameplay_harness_exploratory_report -- --exact --ignored --nocapture"
test-shaders = "run --quiet --locked --profile validation --bin validate-shaders --features test-shader-validation"
test-all-features = "test --quiet --locked --all-features -- --include-ignored"
test-release = "test --quiet --release --locked --all-features -- --include-ignored"
test-doc = "doc --quiet --locked --no-deps"
