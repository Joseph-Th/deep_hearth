[target.x86_64-pc-windows-msvc]
# LLVM is part of the supported local Windows toolchain. `lld-link` materially reduces the link cost
# of the large gameplay/test binaries compared with the default MSVC linker.
linker = "lld-link.exe"

[alias]
# Daily feedback stays on the smallest artifact that can catch the current class of mistake. The
# compile-only aliases avoid codegen/linking while code is unstable; exact unit tests and the core
# audit reuse one feature-minimal test artifact while gameplay targets opt into their setup feature.
check-fast = "check --quiet --locked --lib"
# `lint-fast` is the fast lib-only Clippy loop for unstable code. The explicit
# `python ci.py gate --lint` checkpoint separately covers production plus the
# representative consolidated gameplay/report surfaces; specialized shader and
# soak code keep their own opt-in lanes.
lint-fast = "clippy --quiet --locked --lib -- -D warnings"
# Keep the ordinary core-test graph feature-minimal so exact/suite repair loops and
# the core audit reuse the same incremental artifact. The explicit all audit pays
# for the test-gameplay feature graph only when it also needs gameplay binaries.
test-core = "test --quiet --locked --lib"
# Soak-only code is feature-gated out of the ordinary unit-test artifact so daily edits do not
# type-check/codegen long-horizon fixtures. The explicit soak lane pays that cost only on demand.
test-soak = "test --quiet --locked --lib --features test-soak -- --ignored"
# Gameplay target selection and exploratory reporting are owned by ci.py so the target catalog is not
# repeated across a family of Cargo aliases. Shader validation reuses the debug-symbol-free test profile
# rather than creating a third local codegen profile solely for one diagnostic binary.
test-shaders = "run --quiet --locked --profile test --bin validate-shaders --features test-shader-validation"
test-doc = "doc --quiet --locked --no-deps"
