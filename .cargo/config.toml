[build]
# Keep every local Cargo entrypoint on one artifact cache. Environment-level CARGO_TARGET_DIR still
# overrides this when an intentionally isolated build is needed.
target-dir = "target/local-ci"
# Prefer dynamic dependencies for local verification so exact tests and focused harness binaries
# relink cheaply. Keeping this in Cargo config, rather than Python wrappers, gives direct Cargo and
# repository tools the same artifact shape.
rustflags = ["-Cprefer-dynamic"]

[target.x86_64-pc-windows-msvc]
# LLVM is part of the supported local Windows toolchain. `lld-link` materially reduces the link cost
# of the large gameplay/test binaries compared with the default MSVC linker.
linker = "lld-link.exe"

[alias]
# Daily feedback stays on the smallest artifact that can catch the current class of mistake.
# `check-fast` is an alternative when no executable contract fits; test preflights use
# `tools/run_test.py --build` so successful compilation warms the exact artifact that will run.
# Every repository-owned lane keeps one test-profile shape so switching tools does not invalidate
# local incremental reuse.
check-fast = "check --quiet --locked --profile test --lib"
# One lib-only Clippy shape serves both the direct edit loop and `gate --lint`.
# Gameplay/report wrappers are compiled by their focused or audit lanes instead of
# cloning the same large harness graph under Clippy. It shares the same profile/cache as tests.
lint-fast = "clippy --quiet --locked --profile test --lib -- -D warnings"
# Broad core audits reuse the same feature-minimal library-test artifact as exact unit tests.
test-core = "test --quiet --locked --lib"
# Soak-only code is feature-gated out of the ordinary unit-test artifact so daily edits do not
# type-check/codegen long-horizon fixtures. The explicit soak lane pays that cost only on demand.
test-soak = "test --quiet --locked --lib --features test-soak -- --ignored"
# Gameplay target selection and exploratory reporting are owned by ci.py so the target catalog is not
# repeated across a family of Cargo aliases. Shader validation reuses the debug-symbol-free test profile
# rather than creating a third local codegen profile solely for one diagnostic binary.
test-shaders = "run --quiet --locked --profile test --bin validate-shaders --features test-shader-validation"
test-doc = "doc --quiet --locked --no-deps"
