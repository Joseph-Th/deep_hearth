[build]
# Keep every local Cargo entrypoint under one persistent target root. Cargo profiles own separate
# hot artifact directories for the monolithic lib-test crate and smaller integration/gameplay crates.
target-dir = "target/local-ci"
# Repository entrypoints serialize separate Cargo builds. Cargo itself should use all host
# parallelism inside that one build, so do not pin `jobs` here or in routine aliases.

[target.x86_64-pc-windows-msvc]
# Keep Rust's default static dependency linkage. Local focused-test benchmarks are faster than
# `prefer-dynamic`, especially for warm relinks. `lld-link` also materially reduces the link cost of
# the large gameplay/test binaries compared with the default MSVC linker.
linker = "lld-link.exe"

[alias]
# Daily feedback stays on the smallest artifact that can catch the current class of mistake.
# `check-fast` is only for production code when no executable contract fits. Test preflights use
# `tools/run_test.py --build` so successful compilation warms the exact artifact that will run.
check-fast = "check --quiet --locked --profile test --lib"
# One lib-only Clippy shape serves both the direct edit loop and `gate --lint`.
# Gameplay/report wrappers are compiled by their focused or audit lanes instead of
# cloning the same large harness graph under Clippy. It shares the integration test profile/cache.
lint-fast = "clippy --quiet --locked --profile test --lib -- -D warnings"
# The large lib-test crate keeps its own persistent profile so unit-test rebuilds stay isolated from
# focused gameplay artifacts. Core and exact tests share one additive feature shape so the expensive
# library artifact is never duplicated while both profiles use the same incremental codegen tuning.
test-core = "test --quiet --locked --profile unit-test --lib --features test-gameplay"
# Soak-only code is feature-gated out of the ordinary unit-test artifact so daily edits do not
# type-check/codegen long-horizon fixtures. The explicit soak lane pays that cost only on demand.
test-soak = "test --quiet --locked --profile unit-test --lib --features test-soak -- --ignored"
# Gameplay target selection and exploratory reporting are owned by ci.py so the target catalog is not
# repeated across a family of Cargo aliases. Shader validation reuses the debug-symbol-free test profile
# rather than creating a third local codegen profile solely for one diagnostic binary.
test-shaders = "run --quiet --locked --profile test --bin validate-shaders --features test-shader-validation"
test-doc = "doc --quiet --locked --no-deps"
