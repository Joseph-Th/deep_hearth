[alias]
# Daily feedback stays on the default feature set so expensive harness/parser-only dependencies do
# not enter ordinary edit-loop builds. Specialized lanes opt into those features explicitly.
test-check = "check --locked --all-targets"
test-lint = "clippy --locked --all-targets -- -D warnings"
test-lint-all = "clippy --locked --all-targets --all-features -- -D warnings"
test-fast = "test --quiet --locked --lib"
test-soak = "test --quiet --locked --lib --features test-soak soak"
test-ci-core = "test --quiet --locked --lib --features test-soak"
test-gameplay = "test --quiet --locked --test gameplay_harness --features test-gameplay"
test-gameplay-report = "test --quiet --locked --test gameplay_harness --features test-gameplay -- --nocapture"
test-shaders = "run --quiet --locked --bin validate-shaders --features test-shader-validation"
test-all = "test --quiet --locked --all-features"
test-release = "test --quiet --release --locked --all-features"
test-doc = "doc --quiet --locked --no-deps"
