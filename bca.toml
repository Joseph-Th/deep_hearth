# Big Code Analysis policy for maintained Rust source. The routine gate intentionally uses only cognitive
# complexity because it tracks nested decision logic without penalizing exhaustive Rust
# matches, explicit typed constructors, or large-but-cohesive files. Other BCA metrics remain advisory;
# TESTING.md owns the repository-pinned report and diff commands used to inspect them.
paths = ["src"]
exclude_from = ".bcaignore"
exclude_tests = true
cyclomatic_count_try = false

[check]
baseline = ".bca-baseline.toml"
baseline_fuzzy_match = true

[thresholds]
cognitive = 25
